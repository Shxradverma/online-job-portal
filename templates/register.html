{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · OnlineJobPortal</title><link rel="stylesheet" href="{% static 'portal.css' %}"></head><body>
<header><a href="/" class="brand">OnlineJobPortal</a><a href="/login/">Sign in</a></header>
<main class="narrow"><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>Let's get you started.</h1><p>Find an opportunity or build your team.</p>
<form id="registerForm" class="panel"><label>Username<input name="username" required maxlength="150" autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><p class="muted">Use at least 8 characters; avoid common or entirely numeric passwords.</p><label>I want to<select name="role"><option value="CANDIDATE">Find a job</option><option value="RECRUITER">Hire candidates</option></select></label><button>Create account</button><p id="message" role="status" aria-live="polite"></p></form></main>
<script>
document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),message=document.getElementById('message');button.disabled=true;try{const response=await fetch('/api/auth/register/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await response.json();if(!response.ok)throw new Error(Object.entries(data).map(([k,v])=>k+': '+v).join(' '));message.textContent='Account created. Sign in to continue.';window.location.href='/login/';}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
