name: Portal checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-47295837495837
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test api --settings=config.test_settings
      - run: python manage.py collectstatic --noinput
      - run: node --check static/dashboard.js && node --check static/auth.js && node --check static/script.js
